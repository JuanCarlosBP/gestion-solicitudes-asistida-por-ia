<a class="saltar" href="#contenido" (click)="contenido.focus(); $event.preventDefault()"
  >Saltar al contenido</a
>
<header class="cabecera">
  <a routerLink="/inicio" class="marca" aria-label="Gestión de Solicitudes, inicio"
    ><span class="simbolo" aria-hidden="true">GS</span><span>Gestión de Solicitudes</span></a
  >
  <nav aria-label="Navegación principal">
    <a routerLink="/inicio" routerLinkActive="activo" ariaCurrentWhenActive="page">Inicio</a>
    @if (sesion.autenticado()) {
      @if (proveedores.consultar()) {
        <a routerLink="/proveedores" routerLinkActive="activo" ariaCurrentWhenActive="page"
          >Proveedores</a
        >
      }
      <a routerLink="/mi-cuenta" routerLinkActive="activo" ariaCurrentWhenActive="page"
        >Mi cuenta</a
      >
    } @else {
      <a routerLink="/acceso" routerLinkActive="activo" ariaCurrentWhenActive="page">Acceso</a>
    }
  </nav>
  <span class="entorno">Entorno local</span>
</header>
<main #contenido id="contenido" tabindex="-1"><router-outlet /></main>
<footer>Gestión de Solicitudes · Proveedores</footer>
