name: Verificación de base, identidad, proveedores, solicitudes y aprobaciones

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOCKER_VERSION: v29.1.3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MAVEN_USER_HOME: ${{ github.workspace }}/tmp/maven-user
      QA_EVIDENCE_DIR: ${{ github.workspace }}/tmp/evidencias/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12.1'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Docker fijado para PostgreSQL real
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          version: ${{ env.DOCKER_VERSION }}
          channel: stable
          set-host: 'true'
      - name: Preparar evidencias exclusivas del job
        shell: bash
        run: |
          test "$QA_EVIDENCE_DIR" = "$GITHUB_WORKSPACE/tmp/evidencias/backend"
          rm -rf -- "$QA_EVIDENCE_DIR"
          mkdir -p -- "$QA_EVIDENCE_DIR"
      - name: Construcción, formato, unitarias, PostgreSQL y análisis
        working-directory: backend
        run: sh mvnw -B -ntp verify
      - name: Inventario de dependencias Maven
        working-directory: backend
        run: sh mvnw -B -ntp dependency:list -DoutputFile=target/dependencias.txt -DappendOutput=false
      - name: Preparar base pública de vulnerabilidades
        shell: pwsh
        run: ./qa/preparar-auditoria.ps1
      - name: Auditoría Maven sin enviar inventarios
        run: node qa/auditar-maven.mjs
      - name: Conservar informes backend
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-backend
          retention-days: 7
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/spotbugs*.xml
            ${{ env.QA_EVIDENCE_DIR }}/maven-osv.json
            ${{ env.QA_EVIDENCE_DIR }}/maven.cdx.json

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NG_CLI_ANALYTICS: 'false'
      npm_config_cache: ${{ github.workspace }}/tmp/npm-cache
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - run: npm ci --no-audit --no-fund
      - run: node ../qa/verificar-dependencias-preliminares.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --reporters=junit --output-file=test-results/unitarias.xml
      - run: npm run build
      - name: Auditorías de producción y desarrollo
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p test-results
          produccion=0
          completa=0
          npm audit --omit=dev --audit-level=high --json > test-results/audit-produccion.json || produccion=$?
          npm audit --audit-level=high --json > test-results/audit-completo.json || completa=$?
          echo "Resultados de auditoría: producción=$produccion; completa=$completa"
          # Un fallo requiere analizar severidad/aplicabilidad conforme a ADR-0002.
          test "$produccion" -eq 0 && test "$completa" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: informes-frontend
          path: frontend/test-results/
          retention-days: 7

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tmp/playwright
      npm_config_cache: ${{ github.workspace }}/tmp/npm-cache
      QA_EVIDENCE_DIR: ${{ github.workspace }}/tmp/evidencias/compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Docker fijado para integración
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          version: ${{ env.DOCKER_VERSION }}
          channel: stable
          set-host: 'true'
      - name: Compose 2.40.3 con integridad comprobada
        shell: bash
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl --fail --location --silent --show-error https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64 -o "$RUNNER_TEMP/docker-compose"
          echo "dba9d98e1ba5bfe11d88c99b9bd32fc4a0624a30fafe68eea34d61a3e42fd372  $RUNNER_TEMP/docker-compose" | sha256sum --check
          install -m 0755 "$RUNNER_TEMP/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
          docker version --format '{{.Server.Version}}'
          docker compose version
      - name: Preparar evidencias exclusivas del job
        shell: bash
        run: |
          test "$QA_EVIDENCE_DIR" = "$GITHUB_WORKSPACE/tmp/evidencias/compose"
          rm -rf -- "$QA_EVIDENCE_DIR"
          mkdir -p -- "$QA_EVIDENCE_DIR"
      - name: Preparar dependencias y navegador
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Arranque local ficticio
        run: |
          cp infraestructura/.env.example infraestructura/.env
          docker compose --env-file infraestructura/.env -f infraestructura/compose.yaml config --quiet
          docker compose --env-file infraestructura/.env -f infraestructura/compose.yaml up -d --build --wait --wait-timeout 120
      - name: Persistencia, caída real y recuperación
        shell: pwsh
        run: ./qa/verificar-compose.ps1
      - name: Sesiones, reinicio, rotación y reutilización
        run: node qa/verificar-sesiones-compose.mjs
      - name: Proveedores, permisos, concurrencia y persistencia
        run: node qa/verificar-proveedores-compose.mjs
      - name: Solicitudes, importes, permisos e idempotencia
        run: node qa/verificar-solicitudes-compose.mjs
      - name: Aprobaciones, eventos, permisos y concurrencia
        run: node qa/verificar-aprobaciones-compose.mjs
      - name: Usuario ficticio ajeno para navegador
        run: >-
          node --input-type=module -e "import {readFileSync,appendFileSync} from 'node:fs';
          const usuarios=JSON.parse(readFileSync(process.env.QA_EVIDENCE_DIR+'/usuarios-aprobaciones.json','utf8'));
          appendFileSync(process.env.GITHUB_ENV,'E2E_AJENO_CORREO='+usuarios.ajeno.correo+'\n'+'E2E_MULTIPLE_CORREO='+usuarios.multiple.correo+'\n');"
      - name: Navegador 001 a 005, accesibilidad y Swagger
        working-directory: frontend
        run: npm run test:e2e
      - name: Documentación y búsqueda acotada de secretos
        run: node qa/verificar-documentacion.mjs
      - name: Actionlint 1.7.12 y sintaxis de verificadores
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/ci.yml
          node --check qa/verificar-sesiones-compose.mjs
          node --check qa/verificar-proveedores-compose.mjs
          node --check qa/verificar-solicitudes-compose.mjs
          node --check qa/verificar-aprobaciones-compose.mjs
          node --check qa/verificar-evolucion-v5.mjs
          node --check qa/preparar-usuarios-solicitudes.mjs
      - name: Parada sin eliminar volúmenes
        if: ${{ always() }}
        run: docker compose --env-file infraestructura/.env -f infraestructura/compose.yaml stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: informes-compose
          retention-days: 7
          path: |
            frontend/test-results/
            ${{ env.QA_EVIDENCE_DIR }}/
