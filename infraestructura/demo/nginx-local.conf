worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  sendfile on;
  client_max_body_size 128k;
  client_body_timeout 5s;
  client_header_timeout 5s;
  keepalive_timeout 15s;
  limit_req_zone $binary_remote_addr zone=peticiones:1m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=reservas:1m rate=6r/m;
  limit_req_zone $binary_remote_addr zone=acceso:1m rate=90r/m;
  limit_req_status 429;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location = /api/demo/reservas {
      limit_req zone=reservas burst=6 nodelay;
      proxy_pass http://backend:8080;
      proxy_set_header Host $http_host;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }
    location ~ ^/api/(demo/acceso|autenticacion/(iniciar-sesion|renovar))$ {
      limit_req zone=acceso burst=24 nodelay;
      proxy_pass http://backend:8080;
      proxy_set_header Host $http_host;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }
    location /api/ {
      limit_req zone=peticiones burst=40 nodelay;
      proxy_pass http://backend:8080;
      proxy_set_header Host $http_host;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }
    location /v3/ { return 404; }
    location /swagger-ui { return 404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
