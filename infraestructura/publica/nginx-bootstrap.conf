worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  server_tokens off;
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080 default_server;
    server_name _;
    return 444;
  }
  server {
    listen 8080;
    server_name gestion-empresarial.jcbpsoftware.com;
    location ^~ /.well-known/acme-challenge/ { root /run/acme; default_type text/plain; }
    location / { default_type text/plain; return 503 'Aplicacion en preparacion.\n'; }
  }
}
