worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  sendfile on;
  client_max_body_size 128k;
  client_body_timeout 5s;
  client_header_timeout 5s;
  keepalive_timeout 15s;
  limit_req_zone $binary_remote_addr zone=peticiones:1m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=reservas:1m rate=6r/m;
  limit_req_zone $binary_remote_addr zone=acceso:1m rate=90r/m;
  limit_req_status 429;
  server { listen 8080 default_server; server_name _; return 444; }
  server {
    listen 8080;
    server_name gestion-empresarial.jcbpsoftware.com;
    location ^~ /.well-known/acme-challenge/ { root /run/acme; default_type text/plain; }
    location / { return 308 https://gestion-empresarial.jcbpsoftware.com$request_uri; }
  }
  server {
    listen 8443 ssl default_server;
    server_name gestion-empresarial.jcbpsoftware.com;
    if ($host != gestion-empresarial.jcbpsoftware.com) { return 444; }
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    root /usr/share/nginx/html;
    index index.html;
    # Solo este nombre, sin includeSubDomains ni preload: no altera la web principal.
    add_header Strict-Transport-Security 'max-age=86400' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    if (-f /run/mantenimiento/activo) { return 503; }
    proxy_set_header Host $host;
    # No confiar en cabeceras Forwarded aportadas por el visitante.
    proxy_set_header Forwarded '';
    proxy_set_header X-Forwarded-For '';
    proxy_set_header X-Forwarded-Proto '';
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    location = /api/demo/reservas {
      limit_req zone=reservas burst=6 nodelay;
      proxy_pass http://backend:8080;
    }
    location ~ ^/api/(demo/acceso|autenticacion/(iniciar-sesion|renovar))$ {
      limit_req zone=acceso burst=24 nodelay;
      proxy_pass http://backend:8080;
    }
    location /api/ {
      limit_req zone=peticiones burst=40 nodelay;
      proxy_pass http://backend:8080;
    }
    location /v3/ { return 404; }
    location /swagger-ui { return 404; }
    location = /version.json { alias /run/publico/version.json; default_type application/json; }
    location = / { try_files /presentacion/index.html =404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
