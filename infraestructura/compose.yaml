name: gestion-solicitudes-001
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    user: postgres
    # Evita detalles de filas y parámetros sensibles en errores del servidor.
    command:
      - postgres
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_duration_sample=-1
      - -c
      - "log_line_prefix=%m [%p] %e "
    environment:
      POSTGRES_DB: gestion
      POSTGRES_USER: administrador_local
      POSTGRES_PASSWORD: ${POSTGRES_CLAVE:?Configura POSTGRES_CLAVE en .env}
      APP_PASSWORD: ${APP_CLAVE:?Configura APP_CLAVE en .env}
      MIGRATION_PASSWORD: ${MIGRACION_CLAVE:?Configura MIGRACION_CLAVE en .env}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./postgres/inicializar.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [datos]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U administrador_local -d gestion"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"
  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gestion
      DB_USUARIO: gestion_app
      DB_CLAVE: ${APP_CLAVE:?Configura APP_CLAVE en .env}
      MIGRACION_USUARIO: gestion_migracion
      MIGRACION_CLAVE: ${MIGRACION_CLAVE:?Configura MIGRACION_CLAVE en .env}
      SERVIDOR_DIRECCION: 0.0.0.0
      SPRING_PROFILES_ACTIVE: local
      DEMO_SOLICITANTE_CORREO: ${DEMO_SOLICITANTE_CORREO:-}
      DEMO_SOLICITANTE_NOMBRE: ${DEMO_SOLICITANTE_NOMBRE:-}
      DEMO_SOLICITANTE_CLAVE: ${DEMO_SOLICITANTE_CLAVE:-}
      DEMO_SUPERVISOR_CORREO: ${DEMO_SUPERVISOR_CORREO:-}
      DEMO_SUPERVISOR_NOMBRE: ${DEMO_SUPERVISOR_NOMBRE:-}
      DEMO_SUPERVISOR_CLAVE: ${DEMO_SUPERVISOR_CLAVE:-}
      DEMO_AUDITOR_CORREO: ${DEMO_AUDITOR_CORREO:-}
      DEMO_AUDITOR_NOMBRE: ${DEMO_AUDITOR_NOMBRE:-}
      DEMO_AUDITOR_CLAVE: ${DEMO_AUDITOR_CLAVE:-}
      DEMO_ADMINISTRADOR_CORREO: ${DEMO_ADMINISTRADOR_CORREO:-}
      DEMO_ADMINISTRADOR_NOMBRE: ${DEMO_ADMINISTRADOR_NOMBRE:-}
      DEMO_ADMINISTRADOR_CLAVE: ${DEMO_ADMINISTRADOR_CLAVE:-}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [datos, web]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"
  frontend:
    build: ../frontend
    ports: ["127.0.0.1:${FRONTEND_PUERTO:-18080}:8080"]
    depends_on: [backend]
    networks: [web]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"
volumes:
  datos-postgres:
networks:
  datos:
    internal: true
  web:
