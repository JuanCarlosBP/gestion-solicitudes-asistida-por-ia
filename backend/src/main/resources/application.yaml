spring:
  application:
    name: gestion-solicitudes
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 3
  flyway:
    url: ${DB_URL}
    user: ${MIGRACION_USUARIO}
    password: ${MIGRACION_CLAVE}
    default-schema: gestion
    schemas: gestion
    create-schemas: false
    clean-disabled: true
    validate-on-migrate: true
server:
  address: ${SERVIDOR_DIRECCION:127.0.0.1}
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    connection-timeout: 5s
springdoc:
  api-docs:
    version: OPENAPI_3_1
  swagger-ui:
    disable-swagger-default-url: true
    supported-submit-methods: get
    validator-url: ""
logging:
  level:
    com.zaxxer.hikari: WARN
